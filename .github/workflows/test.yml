name: Test and build
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv build
      - name: Install built wheel in a clean environment
        run: |
          uv venv /tmp/service-wheel --python ${{ matrix.python }}
          uv pip install --python /tmp/service-wheel/bin/python dist/crewai_seedance-0.1.0-py3-none-any.whl
          /tmp/service-wheel/bin/python -c 'from seedance_crewai import SeedanceGenerateVideoTool, SeedanceRetrieveTaskTool; t = SeedanceRetrieveTaskTool(api_key="fixture"); assert "fixture" not in str(t.model_dump()); assert "task_id" in t.args_schema.model_fields; print("clean wheel import and schema passed")'
